services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webrajya_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-webrajya}
      DB_USERNAME: ${DB_USERNAME:-webrajya}
      DB_PASSWORD: ${DB_PASSWORD:-webrajya_secure_pass}
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - webrajya_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: webrajya_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-webrajya}
      MYSQL_USER: ${DB_USERNAME:-webrajya}
      MYSQL_PASSWORD: ${DB_PASSWORD:-webrajya_secure_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-webrajya_root_secret}
    volumes:
      - webrajya_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  webrajya_db_data:
    name: webrajya_db_data
  webrajya_storage:
    name: webrajya_storage

